<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoceFlow — doces prontos e sob encomenda. Em breve.">
  <title>DoceFlow — Em construção</title>
  <style>
    :root {
      --bg: #fff7f2;
      --card: #ffffff;
      --text: #3b2a2a;
      --muted: #8a6f6f;
      --accent: #d9486b;
      --accent-soft: #fde2e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1518;
        --card: #2a1d21;
        --text: #f6ecee;
        --muted: #b89aa2;
        --accent: #ff6f91;
        --accent-soft: #3d2530;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    .icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
    }
    .tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 15%;
      background: var(--accent);
      border-radius: 999px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🧁</div>
    <span class="tag">Em construção</span>
    <h1>DoceFlow</h1>
    <p>Estamos preparando algo doce: doces prontos, bolos sob encomenda e muito mais, no seu celular, no balcão e na cozinha.</p>
    <div class="bar" role="progressbar" aria-label="Progresso do projeto" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"><span></span></div>
    <footer>Em breve.</footer>
  </main>
</body>
</html>
