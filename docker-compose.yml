name: doceflow

# Ambiente de desenvolvimento local do DoceFlow (spec §22.2).
# Subir tudo:            docker compose up --build
# Só dependências:       docker compose up -d db azurite
# Com RabbitMQ (broker): docker compose --profile broker up -d

services:
  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=db;Database=DoceFlow;User Id=sa;Password=Dev@1234;TrustServerCertificate=True"
      Messaging__Provider: Log
      Database__MigrateOnStartup: "true"
      Jwt__SecretKey: "chave-de-desenvolvimento-nao-usar-em-producao-32chars!!"
      Jwt__Issuer: DoceFlow
      Jwt__Audience: DoceFlow
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Dev@1234
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Dev@1234 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: ["broker"]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  mssql_data:
  azurite_data:
  rabbitmq_data:
